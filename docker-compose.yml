services:
  db:
    image: postgres:12-alpine
    environment:
      POSTGRES_DB: vectora
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: vectora_postgres
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - vectora_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d vectora"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/vectora
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: vectora_postgres
    ports:
      - "127.0.0.1:8086:8080"
    depends_on:
      db:
        condition: service_healthy
      simulator:
        condition: service_started
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3006:3000"
    depends_on:
      - backend
  simulator:
    build: ./simulator
    ports:
      - "127.0.0.1:8096:8090"
volumes:
  vectora_db:
