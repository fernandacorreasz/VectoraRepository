server { listen 3000; root /usr/share/nginx/html; index index.html; location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $host; } location /swagger-ui/ { proxy_pass http://backend:8080; proxy_set_header Host $host; } location = /v3/api-docs { proxy_pass http://backend:8080; proxy_set_header Host $host; } location / { try_files $uri $uri/ /index.html; } }
